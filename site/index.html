<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102927">
  <title>Favorite Teams Schedule</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./schedule.js"></script>
</head>
<body>
  <header>
    <div class="shell">
      <p class="eyebrow">Seattle · Washington · U.S. Soccer</p>
      <h1>Game schedule</h1>
      <p id="updated">Loading schedule…</p>
    </div>
  </header>
  <main class="shell">
    <div class="filters">
      <label>Team<select id="team"><option value="">All teams</option></select></label>
      <label>Date range<select id="range"><option value="7">Next 7 days</option><option value="30">Next 30 days</option></select></label>
    </div>
    <p id="summary" role="status"></p>
    <section id="schedule" aria-label="Upcoming games"></section>
    <details><summary>Team schedule sources</summary><ul id="sources"></ul></details>
    <noscript>Enable JavaScript to view the game schedule.</noscript>
  </main>
</body>
</html>
